  <script>

    // <🐼> : EVENTO : DISABLE ALL DROPDOWN  - - - - - - - - - -
        
        function DESATIVAR_TODOS_LIST(){
            var dropdowns = document.querySelectorAll('.LIST_DROPDOWN');
            dropdowns.forEach(function(div) {
                var style = getComputedStyle(div);
                div.style.display = 'none';
            });
        };

        DESATIVAR_TODOS_LIST();

    // </🐼>
    
    // <🐼> : EVENTO : ATIVAR/DESATIVAR EM CLICK ALGUM DROPDOWN - - - - - - - - - -    
        let dropdowns = document.querySelectorAll('.FATHER-DROPDOWN');
        dropdowns.forEach(function(div) {
            div.addEventListener('click', function(event) {
                event.preventDefault(); // Evita que o link navegue
                event.stopPropagation(); // Impede que o evento se propague para o documento
                let currentDisplay = window.getComputedStyle(div.querySelector('.LIST_DROPDOWN')).display;
                if (currentDisplay === 'none') {
                    div.querySelector('.LIST_DROPDOWN').style.display = 'flex';
                    div.querySelector('.LIST_DROPDOWN').style.position = 'absolute'; // 'absolute' para o dropdown
                    div.querySelector('.LIST_DROPDOWN').style.top = '1'; // Alinha ao topo do pai
                    div.querySelector('.LIST_DROPDOWN').style.left = '0'; // Alinha à esquerda do pai
                    div.querySelector('.LIST_DROPDOWN').style.width = '100%'; // Largura total do pai
                    div.querySelector('.LIST_DROPDOWN').style.backgroundColor = '#23232e'; // Cor de fundo
                    // div.querySelector('.LIST_DROPDOWN').style.zIndex = '1000'; // Coloca na frente
                    div.querySelector('.LIST_DROPDOWN').style.display = 'flex'; // 'flex' permite usar flexDirection
                    div.querySelector('.LIST_DROPDOWN').style.flexDirection = 'column'; // 'column' para os itens
                    div.querySelector('.LIST_DROPDOWN').style.justifyContent = 'center'; // Alinha verticalmente
                    div.querySelector('.LIST_DROPDOWN').style.alignItems = 'center'; // Alinha horizontalmente
                    div.querySelector('.LIST_DROPDOWN').style.padding = '10px'; // Espaçamento interno
                    div.querySelector('.LIST_DROPDOWN').style.borderRadius = '5px'; // Bordas arredondadas
                    div.querySelector('.LIST_DROPDOWN').style.boxShadow = '0 4px 8px rgba(0, 0, 0, 0.2)'; // Sombra
                    div.querySelector('.LIST_DROPDOWN').style.transition = 'all 0.3s ease'; // Transição suave
                    div.querySelector('.LIST_DROPDOWN').style.backgroundColor = '#23232e'; // Cor de fundo
                    console.log("Dropdown exibido");  
                } else {
                    div.querySelector('.LIST_DROPDOWN').style.display = 'none';  
                }
            });
        });
    // </🐼> 



        // <🐼> : FUNCTION : ACTIVATE/DEACTIVATE NAVS  - - - - - - - - - - 
      
            // < LEAFT > - - - - - - -  - 
            function toggleNav_LEAFT() {
                const nav = document.getElementById('Navbar_LEFT');
                nav.classList.toggle('hidden');
                DESATIVAR_TODOS_LIST();
            };

            toggleNav_LEAFT();

            // < RIGHT >  - - - - - - -  - 
            function toggleNav_RIGHT() {
                const nav = document.getElementById('Navbar_RIGHT');
                nav.classList.toggle('hidden');
                DESATIVAR_TODOS_LIST();
            };

            toggleNav_RIGHT();
        // </🐼>
      
       
        // <🐼> : EVENTO : CLICK FORA DE ALGUM NAV - - - - - - - - - -
            document.addEventListener('click', function(event) {
                
                const leftNav = document.getElementById('Navbar_LEFT');
                const leftButton = document.querySelector('.Navbar_LEFT_BUTTON');
                const isClickInsideLeft = leftNav.contains(event.target) || leftButton.contains(event.target);
                if (!isClickInsideLeft) { leftNav.classList.add('hidden'); }

                const rightNav = document.getElementById('Navbar_RIGHT');
                const rightButton = document.querySelector('.Navbar_RIGHT_BUTTON');
                const isClickInsideRight = rightNav.contains(event.target) || rightButton.contains(event.target);
                if (!isClickInsideRight) { rightNav.classList.add('hidden'); }


            });
